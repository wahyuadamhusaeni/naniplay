name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Belum terformat:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Linux
        run: CGO_ENABLED=0 go build -o /tmp/naniplay ./cmd/naniplay
      - name: Build Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/naniplay.exe ./cmd/naniplay
